      fill="url(#wordmark)"
    >NaRa</text>

    <path
      d="M292 218C378 248 539 242 637 199"
      stroke="url(#underline)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <g opacity="0.96">
      <circle cx="652" cy="138" r="25" fill="url(#sealRed)"/>
      <circle cx="689" cy="138" r="25" fill="url(#sealGold)" style="mix-blend-mode:screen"/>
    </g>
  </g>

  <text
    x="460"
